name: 🚀 Demo Deploy

on:
  push:
    branches:
      - cmfi

jobs:
  ftp-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          server-dir: ./  # Pushes directly to the FTP user's login directory
          exclude: |
            **/.git*
            **/.github*
            **/uploads/*
            **/System/*
            **/assets/images/*
            **/assets/vendor/*
            **/application/cache/*
            **/application/logs/*
            **/workflows/*