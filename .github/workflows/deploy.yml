name: 🚀 Demo Deploy

on:
  push:
    branches:
      - cmfi

jobs:
  ftp-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4  # Upgraded to v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          # Changed to a relative path. If your FTP user logs directly into sms.libimage.com, change this to ./
          server-dir: ./sms.libimage.com/  
          exclude: |
            **/.git*
            **/.github*
            **/uploads/*
            **/System/*
            **/assets/images/*
            **/assets/vendor/*
            **/application/cache/*
            **/application/logs/*
            **/workflows/*