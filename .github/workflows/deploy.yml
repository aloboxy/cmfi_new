name: 🚀 Demo Deploy (via SSH)

on:
  push:
    branches:
      - cmfi  # Updated to your branch

jobs:
  ssh-deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Executing remote ssh commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}       # Ensure this is your SSH port (usually 22)
          script: |
            cd ~/sms.libimage.com/
            git pull origin cmfi
            
          exclude: |
            **/.git*
            **/.github*
            **/uploads/*
            **/System/*
            **/assets/images/*
            **/assets/vendor/*
            **/application/config/*
            **/application/cache/*
            **/application/logs/*
            **/application/core/*
            **/application/helpers/*
            **/application/hooks/*
            **/application/language/*
            **/application/libraries/*
            **/application/modules/*
            **/application/third_party/*
            **/workflows/*